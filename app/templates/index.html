<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent - Twój Inteligentny Asystent</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f5f7fa;
            --chat-bg: #ffffff;
            --user-msg-bg: #dcf8c6;
            --bot-msg-bg: #ececec;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
            color: var(--text-color);
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--chat-bg);
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        header {
            background: var(--primary-color);
            color: white;
            padding: 1rem;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            background-color: #00ff00;
            border-radius: 50%;
            display: inline-block;
        }

        #chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            position: relative;
            word-wrap: break-word;
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--user-msg-bg);
            border-bottom-right-radius: 2px;
        }

        .bot-message {
            align-self: flex-start;
            background-color: var(--bot-msg-bg);
            border-bottom-left-radius: 2px;
        }

        .reasoning-box {
            margin-top: 10px;
            padding: 10px;
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            font-size: 0.85rem;
            border-radius: 4px;
            display: none; /* Domyślnie ukryte, pokazywane po kliknięciu */
        }
        
        .sources-box {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #666;
        }

        .sources-box a {
            color: var(--primary-color);
            text-decoration: none;
            display: block;
            margin-top: 4px;
        }

        .input-area {
            padding: 20px;
            background: #fff;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 24px;
            outline: none;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 24px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background: #357abd;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .typing-indicator {
            font-style: italic;
            color: #888;
            font-size: 0.8rem;
            margin-left: 10px;
            display: none;
        }

        /* Stylizacja dla kodu i formatowania */
        pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
        code {
            font-family: 'Consolas', 'Monaco', monospace;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <span class="status-indicator"></span>
        AI Agent z Własnym Modelem
    </header>

    <div id="chat-window">
        <!-- Wiadomości będą pojawiać się tutaj -->
        <div class="message bot-message">
            Cześć! Jestem Twoim inteligentnym agentem AI z własnym modelem neuronowym, modułem przeszukiwania sieci i systemem rozumowania. W czym mogę Ci pomóc?
        </div>
    </div>
    
    <div class="typing-indicator" id="typing-indicator">Agent myśli i analizuje...</div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Wpisz swoją wiadomość..." autocomplete="off">
        <button id="send-btn" onclick="sendMessage()">Wyślij</button>
    </div>
</div>

<script>
    const chatWindow = document.getElementById('chat-window');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const typingIndicator = document.getElementById('typing-indicator');

    // Obsługa klawisza Enter
    userInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });

    function appendMessage(text, sender, reasoning = null, sources = []) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message');
        msgDiv.classList.add(sender === 'user' ? 'user-message' : 'bot-message');
        
        // Proste formatowanie tekstu (zamiana nowych linii na <br>)
        let formattedText = text.replace(/\n/g, '<br>');
        msgDiv.innerHTML = formattedText;

        // Dodaj sekcję rozumowania jeśli istnieje
        if (reasoning && sender === 'bot') {
            const reasonDiv = document.createElement('div');
            reasonDiv.classList.add('reasoning-box');
            reasonDiv.style.display = 'block';
            reasonDiv.innerHTML = `<strong>🧠 Proces myślowy:</strong><br>${reasoning.replace(/\n/g, '<br>')}`;
            msgDiv.appendChild(reasonDiv);
        }

        // Dodaj źródła jeśli istnieją
        if (sources && sources.length > 0 && sender === 'bot') {
            const sourcesDiv = document.createElement('div');
            sourcesDiv.classList.add('sources-box');
            sourcesDiv.innerHTML = `<strong>🔍 Źródła:</strong>`;
            sources.forEach((source, index) => {
                // Jeśli source to obiekt z linkiem, stwórz link, inaczej tekst
                if (typeof source === 'object' && source.link) {
                    sourcesDiv.innerHTML += `<a href="${source.link}" target="_blank">${index + 1}. ${source.title || source.link}</a>`;
                } else {
                    sourcesDiv.innerHTML += `<span>${index + 1}. ${source}</span>`;
                }
            });
            msgDiv.appendChild(sourcesDiv);
        }

        chatWindow.appendChild(msgDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // Dodaj wiadomość użytkownika
        appendMessage(text, 'user');
        userInput.value = '';
        userInput.disabled = true;
        sendBtn.disabled = true;
        typingIndicator.style.display = 'block';

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ message: text })
            });

            const data = await response.json();

            if (response.ok) {
                appendMessage(data.response, 'bot', data.reasoning, data.sources);
            } else {
                appendMessage(`Błąd: ${data.error || 'Nieznany błąd'}`, 'bot');
            }
        } catch (error) {
            appendMessage(`Błąd połączenia: ${error.message}`, 'bot');
        } finally {
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
            typingIndicator.style.display = 'none';
        }
    }
</script>

</body>
</html>
